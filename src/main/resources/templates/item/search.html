<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">

        $(document).ready(function() {

            const modal = $("#modalContainer");
            const modalOpenButton = $(".modalOpenButton")
            const modalCloseButton = $("#modalCloseButton");

            modalOpenButton.on('click', function() {

                modal.removeClass('hidden');
            });

            modalCloseButton.on('click', function() {

                modal.addClass('hidden');
            });

        });

            function getItem(item) {
                const dataid = item.getAttribute('data-id');
                const price = item.getAttribute('data-price');
                const stock = item.getAttribute('data-stock');
                const itemImg = item.getAttribute('data-imgurl');
                const itemStat = item.getAttribute('data-stat');
                const itemName = item.getAttribute('data-name');
                const itemId = item.getAttribute('data-itemId');

                const modalImg = $("#modalImg");
                const modalId = $("#modalId");
                const modalPrice =  $("#modalPrice");
                const modalStock = $("#modalStock");

                const itemBuyButton = $(".item-buy");
                const itemWishButton = $(".item-wish");


                const regex = /(\w+)=(\d+|null)/g;
                let match;
                const parseStat = {};
                while ((match = regex.exec(itemStat)) !== null) {
                    // 값을 null로 처리하거나 숫자로 변환
                    if (match[2] === 'null') {
                        parseStat[match[1]] = null;  // "null" 문자열을 null로 처리
                    } else {
                        parseStat[match[1]] = parseInt(match[2], 10);  // 숫자 변환
                    }
                }

                modalImg.attr('src', `/img/${itemImg}.png`);
                modalId.text('ID: ' + dataid);
                modalPrice.text('Price: ' + price);

                itemBuyButton.off('click').on('click',function () {

                    //현재 개수 < 입력한 개수 && 입력한개수 0보다 작으면
                    if(stock < modalStock.val() && modalStock.val() <= 0)
                    {

                        alert("갯수가 적합하지 않습니다");
                        return;
                    }

                    var paramData =
                        {
                            id: dataid,
                            stock: modalStock.val(),
                            price: price,
                            itemImg : itemImg,
                            itemStat : parseStat,
                            name : itemName,
                            itemId : itemId
                        }

                    var param = JSON.stringify(paramData);

                    var url = "/item/search";

                    $.ajax({
                        url      : url,
                        type     : "Patch",
                        contentType : "application/json",
                        data     : param,
                        beforeSend : function(xhr){

                        },
                        dataType : "json",
                        cache   : false,
                        success  : function(result, status){
                            alert("주문 완료.");
                            location.href='/item/search';
                        },
                        error : function(jqXHR, status, error){
                            if(jqXHR.status == '401'){
                                alert('로그인 후 이용해주세요');
                                location.href='/members/login';
                            } else{
                                alert('메소가 부족합니다');
                            }
                        }
                    });

                })


                itemWishButton.off('click').on('click',function () {

                    var paramData =
                        {
                            id: dataid,
                            price: price
                        }

                    var param = JSON.stringify(paramData);

                    var url = "/cart/wish";

                    $.ajax({
                        url      : url,
                        type     : "Post",
                        contentType : "application/json",
                        data     : param,
                        beforeSend : function(xhr){

                        },
                        dataType : "json",
                        cache   : false,
                        success  : function(result, status){
                            alert("찜 완료.");
                            location.href='/item/search';
                        },
                        error : function(jqXHR, status, error){
                            if(jqXHR.status == '401'){
                                alert('로그인 후 이용해주세요');
                                location.href='/members/login';
                            } else{
                                alert(jqXHR.responseText);
                            }
                        }
                    });

                })
}



</script>
</th:block>

<div layout:fragment="content">


    <aside class="sidebar">
        <div th:replace="~{search/searchForm :: searchStatus}"></div>
    </aside>

    <div class="searchItemForm">

        <div class="pagination">
            <!-- 이전 페이지 링크 -->
            <a th:href="@{/item/search/{page}(page=${sellItems.number - 1})}" th:if="${sellItems.hasPrevious()}">&laquo; 이전</a>

            <!-- 현재 페이지 / 총 페이지 수 -->
            <span class="page-info">
        <span th:text="${sellItems.number + 1}"></span> /
        <span th:text="${sellItems.totalPages}"></span>
    </span>

            <!-- 다음 페이지 링크 -->
            <a th:href="@{/item/search/{page}(page=${sellItems.number + 1})}" th:if="${sellItems.hasNext()}">다음 &raquo;</a>
        </div>


        <div id="modalContainer" class="hidden">
            <div id="modalContent">

                <img id="modalImg" src="" alt="Item Image"  style="width: 100px; height: 100px;" />
                <p id="modalId"></p>
                <p id="modalPrice"></p>
                <p>갯수 : <input type="text" id="modalStock" value="1"/></p>

                <button class="item-buy">구매</button>
                <button class="item-wish">찜 하기</button>
                <button id="modalCloseButton">닫기</button>
            </div>
        </div>


        <table class="searchTable">
            <thead>
            <tr>
                <th>아이템 이름</th>
                <th>가격</th>
                <th>개수</th>
                <th>구매</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${sellItems}" class="item-row" data-bs-toggle="modal" data-bs-target="#itemModal">
                <td class="hover-item">
                    <img th:src="@{/img/{img}.png(img=${item.item.itemImg.imgUrl})}"
                         alt="Item Image"
                         style="width: 15px; height: 15px; margin-left: 10px;" />
                    <span th:text="${item.item.name}">아이템 이름</span>

                    <!-- 숨겨진 팝업 -->
                    <div class="popup">
                        <img th:src="@{/img/{img}.png(img=${item.item.itemImg.imgUrl})}"
                             alt="Item Image"
                             style="width: 100px; height: 100px;" />
                        <p th:if="${item.item.itemStat.intel} != null" th:text="'INT: ' + ${item.item.itemStat.intel}"></p>
                        <p th:if="${item.item.itemStat.dex} != null" th:text="'DEX: ' + ${item.item.itemStat.dex}"></p>
                        <p th:if="${item.item.itemStat.str} != null" th:text="'STR: ' + ${item.item.itemStat.str}"></p>
                        <p th:if="${item.item.itemStat.luck} != null" th:text="'LUCK: ' + ${item.item.itemStat.luck}"></p>
                        <p th:if="${item.item.itemStat.hp} != null" th:text="'hp: ' + ${item.item.itemStat.hp}"></p>
                    </div>
                </td>
                <td th:text="${item.price}">가격</td>
                <td th:text="${item.count}">개수</td>
                <td sec:authorize="isAuthenticated()">
                <button type="button" class = "modalOpenButton"
                        th:data-price="${item.price}"
                        th:data-stock="${item.count}"
                        th:data-id="${item.id}"
                        th:data-imgurl ="${item.getItem().itemImg.imgUrl}"
                        th:data-stat = "${item.item.itemStat.toString()}"
                        th:data-name = "${item.item.name}"
                        th:data-itemId = "${item.item.id}"
                        onclick="getItem(this)">
                    구매
                </button> </td>
            </tr>
            </tbody>
        </table>


    </div>

</div>



</html>
