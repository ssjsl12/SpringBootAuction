server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shop?serverTimezone=UTC
    username: root
    password: 1234

  jpa:
   hibernate:
      ddl-auto: update #테이블 생성
  properties:
    .hibernate:
      show_sql: true
      format_sql : true
      database-platform=org:
        hibernate:
          dialect:
            MySQL8Dialect:
  servlet:
    multipart:
      max-file-size: 20MB #파일 한개당 최대 사이즈
      max-request-size: 100MB #요청당 최대 파일 사이즈
  web:
    resources:
      static-locations: classpath:/static/

itemImgLocation: c:/shop/item
uploadPath: file:///C:/shop

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace

